[package]
name = "fhe"
description = "Fully Homomorphic Encryption in Rust"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version = "0.2.1"

[lints]
workspace = true

[lib]
bench = false # Disable default bench (we use criterion)

[features]
tfhe-ntt = ["fhe-math/tfhe-ntt"]
## Enable protobuf-based (de)serialization via `prost`.
## Requires `protoc` to be installed at build time.
protobuf = ["dep:prost", "dep:prost-build", "fhe-math/protobuf"]

[dependencies]
num-bigint = { workspace = true, features = ["rand"] }
fhe-math = { version = "=0.2.1", path = "../fhe-math" }
fhe-traits = { version = "=0.2.1", path = "../fhe-traits" }
fhe-util = { version = "=0.2.1", path = "../fhe-util" }
shamir-rns = { version = "=0.2.1", path = "../shamir-rns", features = ["rayon"] }

bincode.workspace = true
serde.workspace = true
doc-comment.workspace = true
itertools.workspace = true
num-traits.workspace = true
prost = { workspace = true, optional = true }
rand.workspace = true
rand_chacha.workspace = true
rand_distr.workspace = true
rayon.workspace = true
zeroize.workspace = true
zeroize_derive.workspace = true
ndarray.workspace = true
thiserror.workspace = true

[dev-dependencies]
clap.workspace = true
console.workspace = true
criterion.workspace = true
env_logger.workspace = true
indicatif.workspace = true
itertools.workspace = true
log.workspace = true
ndarray.workspace = true
rand.workspace = true
trybuild = "1.0"

[build-dependencies]
prost-build = { workspace = true, optional = true }

[[bench]]
name = "bfv"
harness = false

[[bench]]
name = "bfv_optimized_ops"
harness = false

[[bench]]
name = "bfv_rgsw"
harness = false

[[bench]]
name = "trbfv_bfv_share"
harness = false

[[example]]
name = "bfv_basic"

[[example]]
name = "bfv_ops"

[[example]]
name = "mulpir"
required-features = ["protobuf"]

[[example]]
name = "sealpir"
required-features = ["protobuf"]

[[example]]
name = "rgsw"
required-features = ["protobuf"]

[[example]]
name = "voting"
