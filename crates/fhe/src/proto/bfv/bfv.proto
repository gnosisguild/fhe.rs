syntax = "proto3";

package fhers.bfv;

message Ciphertext {
  repeated bytes c = 1;
  bytes seed = 2;
  uint32 level = 3;
}

message RGSWCiphertext {
  KeySwitchingKey ksk0 = 1;
  KeySwitchingKey ksk1 = 2;
}

message KeySwitchingKey {
  repeated bytes c0 = 1;
  repeated bytes c1 = 2;
  bytes seed = 3;
  uint32 ciphertext_level = 4;
  uint32 ksk_level = 5;
  uint32 log_base = 6;
}

message RelinearizationKey {
  KeySwitchingKey ksk = 1;
}

message LBFVRelinearizationKey {
  KeySwitchingKey ksk_r_to_s = 1;
  KeySwitchingKey ksk_s_to_r = 2;
  repeated bytes b_vec = 3;
  LbfvBinding binding = 4;
}

message LBFVRelinKeyShare {
  KeySwitchingKey ksk_r_to_s = 1;
  KeySwitchingKey ksk_s_to_r = 2;
  LbfvBinding binding = 3;
}

message GaloisKey {
  KeySwitchingKey ksk = 1;
  uint32 exponent = 2;
}

message EvaluationKey {
  repeated GaloisKey gk = 2;
  uint32 ciphertext_level = 3;
  uint32 evaluation_key_level = 4;
}

message Parameters {
  uint32 degree = 1;
  repeated uint64 moduli = 2;
  oneof plaintext_modulus {
    uint64 plaintext = 3;
    bytes plaintext_big = 5;
  }
  uint32 variance = 4;
}

message PublicKey {
  Ciphertext c = 1;
}

message LbfvBinding {
  bytes session_id = 1;
  repeated uint32 participant_ids = 2;
  uint32 participant_id = 3;
  bool aggregate = 4;
}

message LBFVPublicKey {
  repeated Ciphertext c = 1;
  uint32 l = 2;
  bytes seed = 3;
  LbfvBinding binding = 4;
}

message PublicKeyShare {
  Poly p0 = 1;
}

// ---------------------------------------------------------------------------
// MBFV versioned share envelopes
//
// MBFV shares are serialized only through these fail-closed, versioned
// envelopes carrying the contribution binding (session id, canonical
// participant ID list, and this share's participant ID). Old raw polynomial
// bytes have no binding metadata and are rejected by the bound deserializers;
// there is no unbound fallback. This binding is distinct from `LbfvBinding`
// and carries no aggregate flag.
// ---------------------------------------------------------------------------

message MbfvBinding {
  // Opaque session identifier; exactly 32 bytes.
  bytes session_id = 1;
  // Canonical sorted list of unique 1-based participant IDs.
  repeated uint32 participant_ids = 2;
  // This share's contributor within the set.
  uint32 participant_id = 3;
}

message MbfvShareEnvelope {
  // Schema version; must equal the single supported version.
  uint32 version = 1;
  // Required contribution binding metadata.
  MbfvBinding binding = 2;
  // Share kind discriminator; an absent payload is rejected.
  oneof payload {
    MbfvPublicKeySharePayload public_key_share = 3;
    MbfvSecretKeySwitchSharePayload secret_key_switch_share = 4;
  }
}

message MbfvPublicKeySharePayload {
  // p0 share polynomial at the parameters' level-zero context.
  bytes p0_share = 1;
  // EncKeyGen level; collective public-key generation is level zero.
  uint32 level = 2;
}

message MbfvSecretKeySwitchSharePayload {
  // h share polynomial at the input ciphertext's context.
  bytes h_share = 1;
  // Input ciphertext level; validated against the caller-supplied ciphertext.
  uint32 level = 2;
}

message Poly {
  Poly p0 = 1;
}
message SecretKey {
  repeated sint64 coeffs = 1;
}
