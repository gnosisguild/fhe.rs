syntax = "proto3";

package fhers.lbfv;

import "bfv/bfv.proto";

// Participant/session binding carried by l-BFV wire objects. This is
// consistency metadata, not authentication.
message LbfvBinding {
  bytes session_id = 1;
  repeated uint32 participant_ids = 2;
  uint32 participant_id = 3;
  bool aggregate = 4;
}

message LBFVPublicKey {
  repeated bfv.Ciphertext c = 1;
  uint32 l = 2;
  bytes seed = 3;
  LbfvBinding binding = 4;
}

message LBFVRelinearizationKey {
  bfv.KeySwitchingKey ksk_r_to_s = 1;
  bfv.KeySwitchingKey ksk_s_to_r = 2;
  repeated bytes b_vec = 3;
  LbfvBinding binding = 4;
}

message LBFVRelinKeyShare {
  bfv.KeySwitchingKey ksk_r_to_s = 1;
  bfv.KeySwitchingKey ksk_s_to_r = 2;
  LbfvBinding binding = 3;
}
