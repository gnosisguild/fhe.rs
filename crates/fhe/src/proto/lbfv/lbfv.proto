syntax = "proto3";

package fhers.lbfv;

import "bfv/bfv.proto";

message LBFVPublicKey {
  reserved 1, 3;
  reserved "c", "seed";

  uint32 l = 2;

  LBFVPublicKeyExplicit explicit = 4;
  LBFVPublicKeySeeded seeded = 5;
}

message LBFVPublicKeyExplicit {
  repeated bfv.Ciphertext c = 1;
}

message LBFVPublicKeySeeded {
  repeated bytes b = 1;
  bytes seed = 2;
}

// Contribution shares use a distinct envelope from operational public keys.
message LBFVPublicKeyShare {
  LBFVPublicKey key = 1;
}

message LBFVRelinearizationKey {
  bfv.KeySwitchingKey ksk_r_to_s = 1;
  bfv.KeySwitchingKey ksk_s_to_r = 2;
  repeated bytes b_vec = 3;
}

// Contribution shares use a distinct envelope from operational relinearization keys.
message LBFVRelinKeyShare {
  LBFVRelinKeyContribution contribution = 1;
}

message LBFVRelinKeyContribution {
  bfv.KeySwitchingKey ksk_r_to_s = 1;
  bfv.KeySwitchingKey ksk_s_to_r = 2;
}
