name: Rust Stress

on:
  push:
    branches:
      - main

jobs:
  stress:
    name: Stress profiles
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    runs-on: ubuntu-latest
    steps:
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Run threshold BFV and l-BFV stress tests
        run: cargo test -p fhe --release --test trbfv_e2e --test trlbfv_e2e
