name: Rust
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - core/main

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  proto-drift:
    name: Protobuf generated-source drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate Protobuf sources
        run: ./scripts/regenerate-protos.sh
      - name: Check generated sources
        run: git diff --exit-code -- crates/fhe/src/proto crates/fhe-math/src/proto

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            features: --no-default-features
          - name: all features
            features: --all-features
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run clippy
        run: cargo clippy --workspace --all-targets ${{ matrix.features }} -- -D warnings

  doc:
    name: Rustdoc (all features, warnings as errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features

  test-workspace:
    name: Workspace unit tests and doctests (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [--no-default-features, --all-features]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Run workspace unit tests
        run: cargo test --workspace --lib ${{ matrix.features }}
      - name: Run workspace doctests
        run: cargo test --workspace --doc ${{ matrix.features }}

  # --tests discovers integration targets and also runs library tests in release.
  test-integration:
    name: Integration tests (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [--no-default-features, --all-features]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Run all workspace integration tests
        run: cargo test --workspace --release --tests ${{ matrix.features }}

  examples-and-benches:
    name: Examples and benchmarks smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile benchmarks
        run: cargo bench -p fhe --benches --all-features --no-run
      - name: Run examples
        run: |
          for example in bfv_basic bfv_mul bfv_ops mulpir rgsw sealpir trlbfv_mul; do
            cargo run --release -p fhe --example "$example"
          done
          for example in trbfv_add trbfv_add_bfv_share trbfv_mul_bfv_share \
            trbfv_mul_bfv_share_mbfv_pk voting; do
            cargo run --release -p fhe --all-features --example "$example"
          done
