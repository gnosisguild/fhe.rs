# https://github.com/actions-rs/meta/blob/master/recipes/quickstart.md
name: Rust
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - core/main

jobs:
  proto-drift:
    name: Protobuf generated-source drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Regenerate Protobuf sources
        run: ./scripts/regenerate-protos.sh
      - name: Check generated sources
        run: git diff --exit-code -- crates/fhe/src/proto crates/fhe-math/src/proto

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          override: true
          components: rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  clippy-core:
    name: Clippy (core)
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

  clippy-serialization:
    name: Clippy (all features)
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test-workspace:
    name: Workspace unit tests and doctests (${{ matrix.features }})
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [--no-default-features, --all-features]
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Run workspace unit tests
        run: cargo test --workspace --lib ${{ matrix.features }}
      - name: Run workspace doctests
        run: cargo test --workspace --doc ${{ matrix.features }}

  # Every supported integration test target runs before merge,
  # auto-discovered via `--tests` (no hand-maintained `--test` list): this
  # includes trbfv_e2e, trlbfv_e2e, profiles, rns_shamir, biguint,
  # unified_context_integration, and fhe-math's ntt_shoup_ops.
  # scripts/check-ci-test-targets.sh (job test-target-contract) checks that
  # no tests/*.rs target is omitted and that feature-gated targets are
  # covered by the --all-features leg. Release profile matches the stress
  # and existing security CI jobs; examples and criterion benches are not
  # test targets and are not run.
  test-integration:
    name: Integration tests (${{ matrix.features }})
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [--no-default-features, --all-features]
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Run all workspace integration tests
        run: cargo test --workspace --release --tests ${{ matrix.features }}

  test-target-contract:
    name: CI test-target contract
    env:
      CARGO_TERM_COLOR: always
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Verify integration test targets are auto-discovered and CI-covered
        run: ./scripts/check-ci-test-targets.sh

  examples-and-benches:
    name: Examples and benchmarks smoke test
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: --workspace --all-targets --all-features
      - uses: actions-rs/cargo@v1
        with:
          command: bench
          args: -p fhe --benches --all-features --no-run
      - name: Run examples
        run: |
          cargo run --release -p fhe --example bfv_basic
          cargo run --release -p fhe --example bfv_mul
          cargo run --release -p fhe --example bfv_ops
          cargo run --release -p fhe --example mulpir
          cargo run --release -p fhe --example pir
          cargo run --release -p fhe --example rgsw
          cargo run --release -p fhe --example sealpir
          cargo run --release -p fhe --example trlbfv_mul
          cargo run --release -p fhe --all-features --example trbfv_add
          cargo run --release -p fhe --all-features --example trbfv_add_bfv_share
          cargo run --release -p fhe --all-features --example trbfv_add_bfv_share_insecure
          cargo run --release -p fhe --all-features --example trbfv_mul_bfv_share
          cargo run --release -p fhe --all-features --example trbfv_mul_bfv_share_mbfv_pk
          cargo run --release -p fhe --all-features --example voting
