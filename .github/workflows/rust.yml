# https://github.com/actions-rs/meta/blob/master/recipes/quickstart.md
name: Rust
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - core/main

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          override: true
      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  clippy-core:
    name: Clippy (core)
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    runs-on: ubuntu-latest
    steps:
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

  clippy-serialization:
    name: Clippy (all features)
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    runs-on: ubuntu-latest
    steps:
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test-toy:
    name: Test toy profiles
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions/checkout@v6
      - name: Run toy and contract tests
        run: cargo test -p fhe --release --no-default-features --test trbfv_contract --test bfv_lbfv_trlbfv_contract

  test-representative:
    name: Test representative profiles
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions/checkout@v6
      - name: Run representative tests
        run: cargo test -p fhe --release --all-features --test bfv_lbfv_trlbfv_contract --test trbfv_contract --test trbfv_secure_e2e

  test-standard-128:
    name: Test standard-128 profile
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    runs-on: ubuntu-latest
    steps:
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Run standard-128 smoke test
        run: cargo test -p fhe --release --test standard_128

  test-serialization:
    name: Test serialization boundary
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    runs-on: ubuntu-latest
    steps:
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Run serialization tests
        run: cargo test -p fhe --release --all-features --test serialization_contract

  stress:
    name: Stress profiles (manual)
    if: github.event_name == 'workflow_dispatch'
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    runs-on: ubuntu-latest
    steps:
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Run secure multiplication stress test
        run: cargo test -p fhe --release --test trbfv_multiplicative_e2e
  examples-and-benches:
    name: Examples and benchmarks smoke test
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    runs-on: ubuntu-latest
    steps:
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: actions/checkout@v6
      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: --workspace --all-targets --all-features
      - uses: actions-rs/cargo@v1
        with:
          command: bench
          args: -p fhe --benches --all-features --no-run
      - name: Run examples
        run: |
          cargo run --release -p fhe --example bfv_basic
          cargo run --release -p fhe --example bfv_mul
          cargo run --release -p fhe --example bfv_ops
          cargo run --release -p fhe --example bfv_test_simple
          cargo run --release -p fhe --example mulpir
          cargo run --release -p fhe --example pir
          cargo run --release -p fhe --example rgsw
          cargo run --release -p fhe --example sealpir
          cargo run --release -p fhe --example trlbfv_mul
          cargo run --release -p fhe --all-features --example trbfv_add
          cargo run --release -p fhe --all-features --example trbfv_add_bfv_share
          cargo run --release -p fhe --all-features --example trbfv_add_bfv_share_insecure
          cargo run --release -p fhe --all-features --example trbfv_mul_bfv_share
          cargo run --release -p fhe --all-features --example trbfv_mul_bfv_share_binding
          cargo run --release -p fhe --all-features --example voting
