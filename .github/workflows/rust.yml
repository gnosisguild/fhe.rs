# https://github.com/actions-rs/meta/blob/master/recipes/quickstart.md
name: Rust
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Check (${{ matrix.features }})
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: ss
            args: --no-default-features
          - features: default
            args: ''
          - features: both
            args: --no-default-features --features fhe/synchronized-decryption
          - features: ss-mbfv
            args: --no-default-features --features fhe/experimental-mbfv
          - features: all
            args: --all-features
    steps:
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions/checkout@v6
      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: --workspace --all-targets ${{ matrix.args }}
      - name: SS-only dependency isolation
        if: matrix.features == 'ss'
        run: |
          python3 - <<'PY'
          import subprocess
          tree = subprocess.check_output([
              'cargo', 'tree', '-p', 'fhe', '--no-default-features',
              '-e', 'normal',
              '--prefix', 'none', '--format', '{p}',
          ], text=True)
          assert not any(line.startswith(('ark-ff ', 'e3-safe ')) for line in tree.splitlines()), tree
          print('SS-only build has no ark-ff or e3-safe dependencies.')
          PY

  test:
    name: Test Suite (${{ matrix.features }})
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: ss
            args: --no-default-features
          - features: default
            args: ''
          - features: both
            args: --no-default-features --features fhe/synchronized-decryption
          - features: ss-mbfv
            args: --no-default-features --features fhe/experimental-mbfv
          - features: all
            args: --all-features
    steps:
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions/checkout@v6
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --release --workspace ${{ matrix.args }}
